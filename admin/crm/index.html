<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>CRM — Abdul Qadeer</title>
  <meta name="description" content="Private CRM admin for abdulqadeerml.com — lead management. Login required." />
<style>
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url(/fonts/Inter-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;}
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url(/fonts/Inter-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;}
@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:300 700;font-display:swap;src:url(/fonts/SpaceGrotesk-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;}
@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:300 700;font-display:swap;src:url(/fonts/SpaceGrotesk-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;}
  :root { --ivory:#070707; --ink:#F3EFE6; --lime:#C5A059; --lime-deep:#8C6A2F; --line:rgba(243,239,230,.14); --muted:rgba(243,239,230,.62); --card:#111111; --red:#e57373; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Inter',system-ui,sans-serif; background:var(--ivory); color:var(--ink); }
  h1,h2 { font-family:'Space Grotesk',sans-serif; margin:0; }
  button { font:inherit; cursor:pointer; }
  input,select,textarea { font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:#0D0D0F; color:#F3EFE6; width:100%; }
  input:focus,select:focus,textarea:focus { outline:2px solid var(--lime-deep); outline-offset:1px; }
  label { font-size:.82rem; font-weight:600; display:block; margin:0 0 5px; }
  .btn { background:var(--ink); color:var(--ivory); border:0; border-radius:10px; padding:10px 18px; font-weight:600; }
  .btn:hover { opacity:.88; }
  .btn-lime { background:var(--lime); color:#171106; }
  .btn-ghost { background:transparent; color:var(--ink); border:1px solid var(--line); }
  .btn-danger { background:transparent; color:var(--red); border:1px solid rgba(192,57,43,.4); }
  .hidden { display:none !important; }
  /* login */
  .login-wrap { min-height:100vh; display:grid; place-items:center; padding:20px; }
  .login-card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:38px 34px; max-width:400px; width:100%; }
  .login-card h1 { font-size:1.5rem; margin-bottom:6px; }
  .login-card p { color:var(--muted); margin:0 0 22px; font-size:.92rem; }
  .login-card .field { margin-bottom:14px; }
  .err { color:var(--red); font-size:.88rem; margin-top:10px; min-height:1.2em; }
  /* app */
  .topbar { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 26px; border-bottom:1px solid var(--line); background:var(--card); position:sticky; top:0; z-index:5; }
  .topbar h1 { font-size:1.25rem; }
  .topbar h1 span { background:var(--lime); color:#171106; padding:0 7px; border-radius:5px; }
  .main { max-width:1200px; margin:0 auto; padding:26px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:22px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
  .stat b { font-family:'Space Grotesk'; font-size:1.7rem; display:block; }
  .stat span { font-size:.78rem; color:var(--muted); font-weight:600; letter-spacing:.04em; text-transform:uppercase; }
  .controls { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .controls input[type=search] { flex:1; min-width:200px; }
  .controls select { width:auto; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  th,td { text-align:left; padding:12px 14px; border-bottom:1px solid var(--line); font-size:.9rem; vertical-align:top; }
  th { font-size:.75rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  tbody tr { cursor:pointer; } tbody tr:hover { background:rgba(197,160,89,.12); }
  .pill { display:inline-block; padding:2px 10px; border-radius:99px; font-size:.75rem; font-weight:700; }
  .st-new { background:rgba(52,211,153,.16); color:#6EE7B7; } .st-contacted { background:rgba(197,160,89,.18); color:#FFD477; } .st-qualified { background:rgba(14,159,110,.2); color:#a5aaff; }
  .st-proposal { background:rgba(255,212,119,.16); color:#FFD477; } .st-won { background:var(--lime); color:#171106; } .st-lost { background:rgba(229,115,115,.16); color:#e57373; }
  .pr-high { color:var(--red); font-weight:700; }
  .empty { text-align:center; padding:48px 20px; color:var(--muted); background:var(--card); border:1px solid var(--line); border-radius:14px; }
  /* drawer */
  .drawer-bg { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:20; }
  .drawer { position:fixed; top:0; right:0; height:100%; width:min(480px,94vw); background:var(--ivory); z-index:21; padding:26px; overflow-y:auto; box-shadow:-8px 0 30px rgba(0,0,0,.2); }
  .drawer h2 { font-size:1.2rem; margin-bottom:16px; }
  .drawer .field { margin-bottom:13px; }
  .drawer .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .drawer-actions { display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }
  .meta { font-size:.8rem; color:var(--muted); }
  @media (max-width:640px){ th:nth-child(4),td:nth-child(4),th:nth-child(6),td:nth-child(6){display:none;} }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="login-view">
  <form class="login-card" id="login-form">
    <h1>CRM <span style="background:var(--lime);padding:0 7px;border-radius:5px">Login</span></h1>
    <p>Authorized access only. Leads are protected by Supabase Row Level Security.</p>
    <div class="field"><label for="li-email">Email</label><input id="li-email" type="email" required autocomplete="username" /></div>
    <div class="field"><label for="li-pass">Password</label><input id="li-pass" type="password" required autocomplete="current-password" /></div>
    <button class="btn btn-lime" type="submit" style="width:100%">Sign in</button>
    <div class="err" id="login-err" role="alert"></div>
    <p class="meta" id="cfg-warn"></p>
  </form>
</div>

<!-- APP -->
<div id="app-view" class="hidden">
  <div class="topbar">
    <h1>Abdul Qadeer <span>CRM</span></h1>
    <div style="display:flex;gap:10px;align-items:center">
      <span class="meta" id="user-email"></span>
      <button class="btn btn-ghost" id="logout-btn">Log out</button>
    </div>
  </div>
  <div class="main">
    <div class="stats" id="stats"></div>
    <div class="controls">
      <input type="search" id="q" placeholder="Search name, email, company…" aria-label="Search leads" />
      <select id="f-status" aria-label="Filter by status">
        <option value="">All statuses</option><option value="new">New</option><option value="contacted">Contacted</option>
        <option value="qualified">Qualified</option><option value="proposal">Proposal sent</option><option value="won">Won</option><option value="lost">Lost</option>
      </select>
      <button class="btn btn-lime" id="add-btn">+ Add lead</button>
      <button class="btn btn-ghost" id="export-btn">Export CSV</button>
    </div>
    <div id="table-zone"></div>
  </div>
</div>

<!-- DRAWER -->
<div class="drawer-bg hidden" id="drawer-bg"></div>
<aside class="drawer hidden" id="drawer" aria-label="Lead details">
  <h2 id="d-title">Lead</h2>
  <form id="lead-form">
    <div class="field"><label>Name *</label><input id="d-name" required maxlength="120" /></div>
    <div class="row">
      <div class="field"><label>Email *</label><input id="d-email" type="email" required maxlength="160" /></div>
      <div class="field"><label>Phone</label><input id="d-phone" maxlength="40" /></div>
    </div>
    <div class="row">
      <div class="field"><label>Company</label><input id="d-company" maxlength="120" /></div>
      <div class="field"><label>Service</label><input id="d-service" maxlength="80" /></div>
    </div>
    <div class="field"><label>Project description</label><textarea id="d-desc" rows="3" maxlength="4000"></textarea></div>
    <div class="row">
      <div class="field"><label>Budget</label><input id="d-budget" maxlength="60" /></div>
      <div class="field"><label>Timeline</label><input id="d-timeline" maxlength="60" /></div>
    </div>
    <div class="row">
      <div class="field"><label>Status</label>
        <select id="d-status"><option value="new">New</option><option value="contacted">Contacted</option><option value="qualified">Qualified</option><option value="proposal">Proposal sent</option><option value="won">Won</option><option value="lost">Lost</option></select></div>
      <div class="field"><label>Priority</label>
        <select id="d-priority"><option value="low">Low</option><option value="normal">Normal</option><option value="high">High</option></select></div>
    </div>
    <div class="row">
      <div class="field"><label>Last contact</label><input id="d-last" type="date" /></div>
      <div class="field"><label>Next follow-up</label><input id="d-next" type="date" /></div>
    </div>
    <div class="field"><label>Internal notes</label><textarea id="d-notes" rows="3" maxlength="8000"></textarea></div>
    <p class="meta" id="d-meta"></p>
    <div class="drawer-actions">
      <button class="btn btn-lime" type="submit">Save</button>
      <button class="btn btn-ghost" type="button" id="d-close">Close</button>
      <button class="btn btn-danger hidden" type="button" id="d-delete">Delete lead</button>
    </div>
    <div class="err" id="d-err" role="alert"></div>
  </form>
</aside>

<script src="config.js"></script>
<script src="/vendor/supabase.js" defer></script>
<script>
window.addEventListener('DOMContentLoaded', function () {
  var $ = function (id) { return document.getElementById(id); };
  var configured = window.CRM_SUPABASE_URL && window.CRM_SUPABASE_ANON_KEY && window.supabase;
  if (!configured) {
    $('cfg-warn').textContent = 'CRM not configured yet — add the Supabase URL + anon key in config.js (see SETUP.md).';
    $('login-form').querySelector('button').disabled = true;
    return;
  }
  var sb = window.supabase.createClient(window.CRM_SUPABASE_URL, window.CRM_SUPABASE_ANON_KEY);
  var leads = [], editingId = null;
  var STATUSES = { new:'New', contacted:'Contacted', qualified:'Qualified', proposal:'Proposal sent', won:'Won', lost:'Lost' };

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
  function fmtDate(d) { return d ? new Date(d).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' }) : '—'; }

  function show(view) {
    $('login-view').classList.toggle('hidden', view !== 'login');
    $('app-view').classList.toggle('hidden', view !== 'app');
  }

  /* ---------- auth ---------- */
  $('login-form').addEventListener('submit', function (e) {
    e.preventDefault(); $('login-err').textContent = '';
    sb.auth.signInWithPassword({ email: $('li-email').value.trim(), password: $('li-pass').value })
      .then(function (r) { if (r.error) { $('login-err').textContent = r.error.message; } });
  });
  $('logout-btn').addEventListener('click', function () { sb.auth.signOut(); });
  sb.auth.onAuthStateChange(function (_e, session) {
    if (session) { $('user-email').textContent = session.user.email; show('app'); loadLeads(); }
    else show('login');
  });

  /* ---------- data ---------- */
  function loadLeads() {
    $('table-zone').innerHTML = '<div class="empty">Loading leads…</div>';
    sb.from('leads').select('*').order('created_at', { ascending: false }).limit(500)
      .then(function (r) {
        if (r.error) { $('table-zone').innerHTML = '<div class="empty">Could not load leads: ' + esc(r.error.message) + '</div>'; return; }
        leads = r.data || []; render();
      });
  }
  function filtered() {
    var q = $('q').value.trim().toLowerCase(), st = $('f-status').value;
    return leads.filter(function (l) {
      if (st && l.status !== st) return false;
      if (!q) return true;
      return [l.name, l.email, l.company, l.service].some(function (v) { return v && v.toLowerCase().indexOf(q) > -1; });
    });
  }
  function render() {
    var today = new Date().toISOString().slice(0, 10);
    var due = leads.filter(function (l) { return l.next_follow_up && l.next_follow_up <= today && l.status !== 'won' && l.status !== 'lost'; }).length;
    var count = function (s) { return leads.filter(function (l) { return l.status === s; }).length; };
    $('stats').innerHTML = [
      ['Total leads', leads.length], ['New', count('new')], ['Qualified', count('qualified')],
      ['Proposals sent', count('proposal')], ['Won', count('won')], ['Follow-ups due', due]
    ].map(function (s) { return '<div class="stat"><b>' + s[1] + '</b><span>' + s[0] + '</span></div>'; }).join('');
    var rows = filtered();
    if (!rows.length) { $('table-zone').innerHTML = '<div class="empty">No leads match. New website inquiries will appear here automatically.</div>'; return; }
    $('table-zone').innerHTML = '<table><thead><tr><th>Name</th><th>Service</th><th>Status</th><th>Priority</th><th>Received</th><th>Follow-up</th></tr></thead><tbody>' +
      rows.map(function (l) {
        return '<tr data-id="' + l.id + '"><td><b>' + esc(l.name) + '</b><br><span class="meta">' + esc(l.email) + (l.company ? ' · ' + esc(l.company) : '') + '</span></td>' +
          '<td>' + esc(l.service || '—') + '</td>' +
          '<td><span class="pill st-' + l.status + '">' + STATUSES[l.status] + '</span></td>' +
          '<td class="' + (l.priority === 'high' ? 'pr-high' : '') + '">' + esc(l.priority) + '</td>' +
          '<td>' + fmtDate(l.created_at) + '</td><td>' + (l.next_follow_up ? fmtDate(l.next_follow_up) : '—') + '</td></tr>';
      }).join('') + '</tbody></table>';
    Array.prototype.forEach.call($('table-zone').querySelectorAll('tbody tr'), function (tr) {
      tr.addEventListener('click', function () { openDrawer(tr.getAttribute('data-id')); });
    });
  }
  $('q').addEventListener('input', render);
  $('f-status').addEventListener('change', render);

  /* ---------- drawer ---------- */
  function openDrawer(id) {
    editingId = id || null;
    var l = id ? leads.filter(function (x) { return x.id === id; })[0] : null;
    $('d-title').textContent = l ? l.name : 'New lead';
    $('d-name').value = l ? l.name : ''; $('d-email').value = l ? l.email : ''; $('d-phone').value = l ? (l.phone || '') : '';
    $('d-company').value = l ? (l.company || '') : ''; $('d-service').value = l ? (l.service || '') : '';
    $('d-desc').value = l ? (l.description || '') : ''; $('d-budget').value = l ? (l.budget || '') : ''; $('d-timeline').value = l ? (l.timeline || '') : '';
    $('d-status').value = l ? l.status : 'new'; $('d-priority').value = l ? l.priority : 'normal';
    $('d-last').value = l ? (l.last_contact || '') : ''; $('d-next').value = l ? (l.next_follow_up || '') : '';
    $('d-notes').value = l ? (l.notes || '') : '';
    $('d-meta').textContent = l ? ('Source: ' + (l.source || 'website') + ' · Received ' + fmtDate(l.created_at) + ' · ID ' + l.id.slice(0, 8)) : '';
    $('d-delete').classList.toggle('hidden', !l); $('d-err').textContent = '';
    $('drawer-bg').classList.remove('hidden'); $('drawer').classList.remove('hidden');
  }
  function closeDrawer() { $('drawer-bg').classList.add('hidden'); $('drawer').classList.add('hidden'); }
  $('add-btn').addEventListener('click', function () { openDrawer(null); });
  $('d-close').addEventListener('click', closeDrawer);
  $('drawer-bg').addEventListener('click', closeDrawer);
  $('lead-form').addEventListener('submit', function (e) {
    e.preventDefault(); $('d-err').textContent = '';
    var payload = { name: $('d-name').value.trim(), email: $('d-email').value.trim(), phone: $('d-phone').value.trim() || null,
      company: $('d-company').value.trim() || null, service: $('d-service').value.trim() || null,
      description: $('d-desc').value.trim() || null, budget: $('d-budget').value.trim() || null, timeline: $('d-timeline').value.trim() || null,
      status: $('d-status').value, priority: $('d-priority').value,
      last_contact: $('d-last').value || null, next_follow_up: $('d-next').value || null, notes: $('d-notes').value.trim() || null };
    var req = editingId ? sb.from('leads').update(payload).eq('id', editingId) : sb.from('leads').insert(Object.assign({ source: 'manual' }, payload));
    req.then(function (r) { if (r.error) { $('d-err').textContent = r.error.message; } else { closeDrawer(); loadLeads(); } });
  });
  $('d-delete').addEventListener('click', function () {
    if (!editingId) return;
    if (!window.confirm('Delete this lead permanently? This cannot be undone.')) return;
    sb.from('leads').delete().eq('id', editingId).then(function (r) {
      if (r.error) { $('d-err').textContent = r.error.message; } else { closeDrawer(); loadLeads(); }
    });
  });

  /* ---------- export ---------- */
  $('export-btn').addEventListener('click', function () {
    var head = ['name','email','phone','company','service','budget','timeline','status','priority','source','created_at','next_follow_up'];
    var csv = [head.join(',')].concat(filtered().map(function (l) {
      return head.map(function (k) { var v = l[k] == null ? '' : String(l[k]); return '"' + v.replace(/"/g, '""') + '"'; }).join(',');
    })).join('\n');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = 'leads-export.csv'; a.click(); URL.revokeObjectURL(a.href);
  });
});
</script>

</html>
